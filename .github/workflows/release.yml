# Builds, signs and publishes a release when a version tag (0.2.0) is pushed. The tag has to
# match versionName in app/build.gradle.kts; the APK lands on a GitHub release with that
# version's CHANGELOG section as its notes. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app's version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$name" != "$VERSION" ]; then
            echo "::error::Tag $VERSION doesn't match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          # The CHANGELOG section for this version, up to the next one.
          awk -v v="$VERSION_NAME" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION_NAME]"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Only on the runner, for this job: neither file is ever committed.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::Signed with a debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/ondu-$VERSION_NAME.apk"
          (cd dist && sha256sum "ondu-$VERSION_NAME.apk" > "ondu-$VERSION_NAME.apk.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "Ondu $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

      # Kept with the run rather than on the release: it maps obfuscated names back to the
      # source, which the release's readers don't need. Without it, crash traces from this
      # build can't be read.
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
