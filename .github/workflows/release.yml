# Builds, signs and publishes a release when a version tag (0.2.0) is pushed. The tag has to
# match versionName in app/build.gradle.kts; the APK lands on a GitHub release with that
# version's CHANGELOG section as its notes. See docs/RELEASING.md.
#
# Run by hand (Actions → Release → Run workflow), it builds a signed test APK of the chosen
# branch instead and attaches it to the run, without a tag, notes or a release.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
      IS_RELEASE: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app's version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$IS_RELEASE" = true ] && [ "$name" != "$VERSION" ]; then
            echo "::error::Tag $VERSION doesn't match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          # A test build is named for its commit too, so builds of one version can be told apart.
          if [ "$IS_RELEASE" = true ]; then
            echo "APK_NAME=ondu-$name" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=ondu-$name-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Extract release notes
        if: env.IS_RELEASE == 'true'
        run: |
          # The CHANGELOG section for this version, up to the next one.
          awk -v v="$VERSION_NAME" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION_NAME]"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Only on the runner, for this job: neither file is ever committed.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::Signed with a debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/$APK_NAME.apk"
          (cd dist && sha256sum "$APK_NAME.apk" > "$APK_NAME.apk.sha256")

      - name: Publish the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions before 1.0 are untested pre-releases, and GitHub labels them so.
          prerelease=$([ "${VERSION_NAME%%.*}" = 0 ] && echo --prerelease || true)
          gh release create "$VERSION" $prerelease \
            --title "Ondu $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

      - name: Attach the test build
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/

      # Kept with the run rather than on the release: it maps obfuscated names back to the
      # source, which the release's readers don't need. Without it, crash traces from this
      # build can't be read.
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.APK_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
